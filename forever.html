<meta charset="utf-8">
<script>
/* Access gate. Same as home.html: WoW Forever poll is open to any signed-in tier —
   captures a session handed back in the URL fragment and bounces to the landing page
   when there is no unexpired one. Every write is API-enforced regardless. */
(function(){
  var m = location.hash.match(/(?:^#|&)session=([^&]+)/);
  if(m){
    try{ localStorage.setItem('vashj_session', decodeURIComponent(m[1])); }catch(e){}
    history.replaceState(null, '', location.pathname + location.search);
  }
  function valid(tok){
    if(!tok) return false;
    try{
      var p = tok.split('.')[0].replace(/-/g,'+').replace(/_/g,'/');
      while(p.length % 4) p += '=';
      var payload = JSON.parse(atob(p));
      return payload.exp && payload.exp > Math.floor(Date.now()/1000);
    }catch(e){ return false; }
  }
  var tok = null;
  try{ tok = localStorage.getItem('vashj_session'); }catch(e){}
  if(!valid(tok)){
    try{ localStorage.removeItem('vashj_session'); }catch(e){}
    location.replace('index.html');
  }
})();
</script>

  .poll-count{font-size:12.5px;color:var(--text-dim);margin:0 0 20px;}

  .q-card{
    background:var(--panel);border:1px solid var(--panel-line);border-radius:10px;
    padding:16px 18px 14px;margin-bottom:14px;
  }
  .q-card h2{
    font-family:'Cinzel',serif;font-size:15px;font-weight:700;margin:0 0 12px;
    color:var(--heading);letter-spacing:.3px;
  }

  /* Each option is a clickable row: input, label + count, and a result bar behind. */
  .opt{
    display:block;position:relative;cursor:pointer;border-radius:7px;padding:8px 10px;
    border:1px solid transparent;margin-bottom:5px;overflow:hidden;
  }
  .opt:hover{background:var(--chip-bg);}
  /* The bar sits behind the text, filling from the left to the option's share. */

  .opt.is-mine .opt-fill{background:rgba(var(--accent-rgb),.28);}
  .opt-row{position:relative;z-index:1;display:flex;align-items:center;gap:10px;}
  .opt input{accent-color:var(--accent);width:16px;height:16px;flex:none;cursor:pointer;}
  .opt-text{flex:1;font-size:13px;color:var(--text);}
  .opt.is-mine .opt-text{color:var(--heading);font-weight:600;}
  .opt-count{font-size:11.5px;color:var(--text-dim);font-variant-numeric:tabular-nums;white-space:nowrap;}

  .poll-comment textarea{
    width:100%;min-height:70px;background:var(--well);border:1px solid var(--panel-line);
    color:var(--text);border-radius:8px;padding:10px 12px;font-family:'Inter',sans-serif;
    font-size:13px;resize:vertical;
  }

  .poll-actions{display:flex;align-items:center;gap:14px;margin:6px 0 26px;}
  .poll-status{font-size:12.5px;color:var(--text-dim);}
  .poll-status.err{color:var(--amber);}
  .poll-status.ok{color:var(--accent);}

  .comments h2{
    font-family:'Cinzel',serif;font-size:15px;font-weight:700;margin:0 0 10px;
    color:var(--heading);letter-spacing:.3px;
  }
  .comments ul{list-style:none;padding:0;margin:0;}
  .comments li{
    background:var(--panel);border:1px solid var(--panel-line);border-radius:8px;
    padding:9px 12px;margin-bottom:7px;font-size:12.5px;color:var(--text);line-height:1.45;
    white-space:pre-wrap;
  }
  .comments .none{font-size:12.5px;color:var(--text-dim);font-style:italic;}
</style>

<script src="menu.js"></script>
<script>
// The poll's questions live here and nowhere else — the backend (/api/poll) is generic and
// tallies whatever question/option ids it is sent. Each answer is stored as a list of chosen
// option ids, so radio (one) and checkbox (many) share the same shape. API_BASE, sessionToken
// and logout come from menu.js.
const QUESTIONS = [
  { id:'play', type:'radio', q:'Are you going to play WoW Forever?', options:[
    ['yes','Yes, definitely'], ['probably','Probably'], ['unsure','Not sure'],
    ['probably_not','Probably not'], ['no','No'] ] },
  { id:'faction', type:'radio', q:'Which faction do you want to play?', options:[
    ['alliance','Alliance'], ['horde','Horde'], ['dontcare',"Don't care"] ] },
  { id:'role', type:'radio', q:'What role do you want to play?', options:[
    ['tank','Tank'], ['melee','Melee DPS'], ['ranged','Ranged DPS'], ['healer','Healer'],
    ['unsure','Not sure'] ] },
  { id:'race', type:'radio', q:'Which race are you leaning toward?', options:[
    ['human','Human'], ['dwarf','Dwarf'], ['nightelf','Night Elf'], ['gnome','Gnome'],
    ['orc','Orc'], ['undead','Undead'], ['tauren','Tauren'], ['troll','Troll'],
    ['skyborne','Skyborne (new — either faction)'], ['nopref','No preference'] ] },
  { id:'otherFaction', type:'radio', q:'If we pick the opposite faction to your preference, will you still join?', options:[
    ['yes','Yes'], ['maybe','Maybe'], ['no','No'], ['nomatter',"Faction doesn't matter to me"] ] },
  { id:'class', type:'radio', q:'Which class interests you most?', options:[
    ['warrior','Warrior'], ['paladin','Paladin'], ['hunter','Hunter'], ['rogue','Rogue'],
    ['priest','Priest'], ['shaman','Shaman'], ['mage','Mage'], ['warlock','Warlock'],
    ['druid','Druid'], ['unsure','Not sure'] ] },
  { id:'focus', type:'checkbox', q:'What are you most looking forward to? (pick any)', options:[
    ['raiding','Raiding'], ['pvp','PvP / Battlegrounds'], ['leveling','Leveling & questing'],
    ['dungeons','5-man dungeons'], ['professions','Professions & economy'],
    ['social','Just hanging out'] ] },
  { id:'server', type:'radio', q:'Which server type do you want?', options:[
    ['pve','PvE'], ['pvp','PvP'], ['rp','RP'], ['rppvp','RP-PvP'], ['dontcare',"Don't care"] ] },
  { id:'commitment', type:'radio', q:'How much do you expect to play?', options:[
    ['hardcore','Hardcore (most days)'], ['regular','Regular (a few nights)'],
    ['casual','Casual (weekends)'], ['whenever','Whenever I can'] ] },
  { id:'guild', type:'radio', q:'Stick with the wooback crew?', options:[
    ['yes','Yes'], ['depends','Depends'], ['no','No'], ['undecided','Undecided'] ] }
];

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// Same authenticated-fetch pair the other data pages use (members.html): Bearer header,
// Content-Type only when there's a body, and central 401→sign-out handling.
function authHeaders(extra){ return Object.assign({ 'Authorization': 'Bearer ' + sessionToken() }, extra || {}); }
async function api(path, opts){
  const res = await fetch(API_BASE + path, Object.assign({
    headers: authHeaders(opts && opts.body ? { 'Content-Type':'application/json' } : null)
  }, opts));
  if(res.status === 401){ setStatus('Session expired — signing out…', 'err'); setTimeout(logout, 1200); throw new Error('401'); }
  return res;
}

function setStatus(msg, kind){
  const el = document.getElementById('status');
  el.textContent = msg || '';
  el.className = 'poll-status' + (kind ? ' ' + kind : '');
}

// Build the form once. Result bars are filled in later by paint() from the tallies.
function buildForm(){
  document.getElementById('questions').innerHTML = QUESTIONS.map(function(q){
    const opts = q.options.map(function(o){
      const id = o[0], label = o[1];
      return '<label class="opt" data-q="' + esc(q.id) + '" data-opt="' + esc(id) + '">' +
        '<span class="opt-fill"></span>' +
        '<span class="opt-row">' +
          '<input type="' + q.type + '" name="' + esc(q.id) + '" value="' + esc(id) + '">' +
          '<span class="opt-text">' + esc(label) + '</span>' +
          '<span class="opt-count" data-count></span>' +
        '</span>' +
      '</label>';
    }).join('');
    return '<div class="q-card"><h2>' + esc(q.q) + '</h2>' + opts + '</div>';
  }).join('');
}

// Reflect the tallies and the caller's own answers onto the built form.
function paint(data){
  const results = data.results || {};
  document.getElementById('pollCount').innerHTML =
    '<b>' + (data.total || 0) + '</b> ' + ((data.total === 1) ? 'member has' : 'members have') + ' answered so far.';

  QUESTIONS.forEach(function(q){
    const byOpt = results[q.id] || {};
    let max = 0;
    q.options.forEach(function(o){ max = Math.max(max, byOpt[o[0]] || 0); });
    q.options.forEach(function(o){
      const el = document.querySelector('.opt[data-q="' + q.id + '"][data-opt="' + o[0] + '"]');
      if(!el) return;
      const n = byOpt[o[0]] || 0;
      el.querySelector('.opt-fill').style.width = (max ? Math.round(n / max * 100) : 0) + '%';
      el.querySelector('[data-count]').textContent = n ? (n + (n === 1 ? ' vote' : ' votes')) : '';
    });
  });

  // Pre-fill and highlight the caller's own selections.
  document.querySelectorAll('.opt').forEach(el => el.classList.remove('is-mine'));
  const mine = data.mine && data.mine.answers ? data.mine.answers : {};
  QUESTIONS.forEach(function(q){
    const chosen = mine[q.id] || [];
    q.options.forEach(function(o){
      const el = document.querySelector('.opt[data-q="' + q.id + '"][data-opt="' + o[0] + '"]');
      if(!el) return;
      const on = chosen.indexOf(o[0]) !== -1;
      el.querySelector('input').checked = on;
      el.classList.toggle('is-mine', on);
    });
  });
  document.getElementById('comment').value = (data.mine && data.mine.comment) || '';

  const list = document.getElementById('comments');
  const comments = data.comments || [];
  list.innerHTML = comments.length
    ? comments.map(c => '<li>' + esc(c) + '</li>').join('')
    : '<li class="none">No comments yet.</li>';
}

// Highlighting follows the live selection, so re-voting reads clearly before saving.
document.getElementById('questions').addEventListener('change', function(e){
  const input = e.target.closest('input');
  if(!input) return;
  const q = QUESTIONS.find(x => x.id === input.name);
  if(q && q.type === 'radio'){
    document.querySelectorAll('.opt[data-q="' + input.name + '"]').forEach(function(el){
      el.classList.toggle('is-mine', el.querySelector('input').checked);
    });
  }else{
    const el = input.closest('.opt');
    if(el) el.classList.toggle('is-mine', input.checked);
  }
});

function collect(){
  const answers = {};
  QUESTIONS.forEach(function(q){
    const picked = Array.from(document.querySelectorAll('input[name="' + q.id + '"]:checked')).map(i => i.value);
    if(picked.length) answers[q.id] = picked;
  });
  return { answers, comment: document.getElementById('comment').value.trim() || null };
}

async function load(){
  try{
    const res = await api('/api/poll');
    if(!res.ok){ setStatus('Could not load the poll (HTTP ' + res.status + ').', 'err'); return; }
    paint(await res.json());
  }catch(err){
    if(String(err.message) !== '401') setStatus('Could not reach the guild database.', 'err');
  }
}

document.getElementById('pollForm').addEventListener('submit', async function(e){
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  setStatus('Saving…');
  try{
    const res = await api('/api/poll', { method:'POST', body: JSON.stringify(collect()) });
    if(!res.ok){
      let detail = 'HTTP ' + res.status;
      try{ const j = await res.json(); if(j && j.detail) detail = j.detail; }catch(e){}
      setStatus('Could not save: ' + detail, 'err');
      return;
    }
    await load();
    setStatus('Saved — thanks!', 'ok');
  }catch(err){
    if(String(err.message) !== '401') setStatus('Could not reach the guild database.', 'err');
  }finally{
    btn.disabled = false;
  }
});

buildForm();
load();
</script>
