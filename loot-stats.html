<meta charset="utf-8">
<script>
/* Access gate. Same as loot-history.html: the hall of shame is open to any
   signed-in tier — it is built entirely from /api/loot/history, which is
   session-gated; this only decides whether the page renders at all. */
(function(){
  var m = location.hash.match(/(?:^#|&)session=([^&]+)/);
  if(m){
    try{ localStorage.setItem('vashj_session', decodeURIComponent(m[1])); }catch(e){}
    history.replaceState(null, '', location.pathname + location.search);
  }
  function valid(tok){
    if(!tok) return false;
    try{
      var p = tok.split('.')[0].replace(/-/g,'+').replace(/_/g,'/');
      while(p.length % 4) p += '=';
      var payload = JSON.parse(atob(p));
      return payload.exp && payload.exp > Math.floor(Date.now()/1000);
    }catch(e){ return false; }
  }
  var tok = null;
  try{ tok = localStorage.getItem('vashj_session'); }catch(e){}
  if(!valid(tok)){
    try{ localStorage.removeItem('vashj_session'); }catch(e){}
    location.replace('index.html');
  }
})();
</script>

<script>
// API_BASE (the shared .NET backend host) is provided by menu.js.
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// WoW class colours (Blizzard palette), shared with loot-history.html / loot.html.
const CLASS_COLORS = {
  warrior:'#c79c6e', paladin:'#f58cba', hunter:'#abd473', rogue:'#fff569',
  priest:'#ffffff', deathknight:'#e0475f', shaman:'#3b8de0', mage:'#69ccf0',
  warlock:'#a99ce0', monk:'#00ff96', druid:'#ff7d0a', demonhunter:'#a330c9',
  evoker:'#33937f'
};
function classColor(cls){
  if(!cls) return null;
  return CLASS_COLORS[String(cls).toLowerCase().replace(/[^a-z]/g,'')] || null;
}
function nameHtml(c){
  const col = classColor(c && c.cls);
  const inner = '<span' + (col ? ' style="color:' + col + '"' : '') + '>' + esc(c ? c.name : '?') + '</span>';
  // Every name here is a character we hold an id for, so it links to its sheet.
  return c && c.id ? '<a href="character.html?id=' + esc(c.id) + '" class="chr-link">' + inner + '</a>' : inner;
}
// A bare name from an award (a master looter, a rivalry side) rendered class-coloured
// when we happen to hold a character by that name, and as plain text otherwise.
function knownName(name){
  const c = CHARS.get(String(name || '').toLowerCase());
  return c ? nameHtml(c) : esc(name || '?');
}

/* ───────────────────────── Aggregation ─────────────────────────
   Everything below is derived client-side from the same award list the loot
   history page renders — no extra endpoint. Characters are keyed by lower-cased
   name because a winner and a bidder are resolved to the same Character server
   side, so the names already agree; the key just makes the join case-proof. */
const CHARS = new Map();
function chr(name, cls, id){
  const key = String(name || '').toLowerCase();
  let c = CHARS.get(key);
  if(!c){
    c = { name: name, cls: cls || null, id: id || null, rolls:0, sum:0, sumSq:0, wins:0, losses:0,
          hundreds:0, ones:0, osWins:0, nearMiss:0, bigWins:0, lostTo:new Map(),
          victims:new Set(), wonItems:new Set(), streak:0, worstStreak:0 };
    CHARS.set(key, c);
  }
  if(!c.cls && cls) c.cls = cls;
  if(!c.id && id) c.id = id;
  return c;
}

let TOTALS = { awards:0, rolls:0, de:0 };
// Single-fact records that aren't leaderboards (best story, not biggest number).
let LUCKIEST = null, CONTESTED = null;

// Tallies the per-character map can't hold: pairwise, per-looter, per-night, per-item.
const H2H = new Map();       // "keyA|keyB" (sorted) → { [winnerKey]: times } — rivalry
const LOOTERS = new Map();   // master-looter name → items handed out
const GIFTS = new Map();     // "winner looter" → items from that one looter — teacher's pet
const NIGHTS = new Map();    // YYYY-MM-DD → items awarded that night
const DE_ITEMS = new Map();  // item key → { count, name, id } — shard bait
const ITEM_ROLLS = new Map();// item key → { rolls, drops, name, id } — white whale

// An item is keyed by id when we have one, else by lower-cased name, so the same drop
// across nights lands in one bucket.
function itemKey(a){ return a.itemId != null ? 'i' + a.itemId : 'n' + String(a.itemName || '').toLowerCase(); }
// The calendar day an award landed on (viewer's local zone) — one raid night. Built
// from local parts, not toISOString(), so a late-night award stays on its own night.
function nightKey(a){
  const d = new Date(a.awardedAt);
  if(isNaN(d)) return null;
  const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}

function aggregate(rows){
  // Raw pass — every award, including the zero-roll ones the leaderboard loop below
  // drops. A master-loot hand-out and a disenchant carry no rolls but *are* the looter,
  // loot-night and shard signals, so those tallies can only be built here.
  rows.forEach(a => {
    const looter = a.awardedBy ? String(a.awardedBy).trim() : '';
    if(looter && !a.disenchanted){
      LOOTERS.set(looter, (LOOTERS.get(looter) || 0) + 1);
      // Handing loot to yourself isn't favouritism, so it doesn't feed teacher's pet.
      if(a.character && String(a.character).toLowerCase() !== looter.toLowerCase()){
        const gk = a.character + '␀' + looter;
        const g = GIFTS.get(gk) || { winner: a.character, looter: looter, count: 0 };
        g.count++; GIFTS.set(gk, g);
      }
    }
    const nk = nightKey(a);
    if(nk) NIGHTS.set(nk, (NIGHTS.get(nk) || 0) + 1);
    if(a.disenchanted){
      const ik = itemKey(a);
      const d = DE_ITEMS.get(ik) || { count: 0, name: a.itemName, id: a.itemId };
      d.count++; DE_ITEMS.set(ik, d);
    }
  });

  // An award with no rolls was handed out, not won — a master-loot assignment, a
  // trade, an export from before Gargul recorded bids. Counting it would hand the
  // winner a free win nobody had the chance to lose, so it sits out of every stat.
  // Oldest first: losing streaks only mean something in chronological order.
  const awards = rows
    .filter(a => (a.rolls || []).length > 0)
    .sort((a,b) => new Date(a.awardedAt) - new Date(b.awardedAt));

  awards.forEach(a => {
    TOTALS.awards++;
    if(a.disenchanted) TOTALS.de++;

    const rolls = a.rolls || [];
    TOTALS.rolls += rolls.length;
    const winnerKey = a.disenchanted ? null : String(a.character || '').toLowerCase();

    // The winner's own bid, when they placed one — its amount is the winning roll
    // and its classification is the fallback for Gargul's award-level OS flag.
    const winRoll = winnerKey ? rolls.find(r => String(r.player || '').toLowerCase() === winnerKey) : null;
    const isOS = a.offSpec === true ||
      (!!winRoll && String(winRoll.classification || '').toUpperCase() === 'OS');

    // The winner's accumulator, hoisted so the roll loop below can credit them the
    // people they beat (taxman) as it walks the losers.
    const w = winnerKey ? chr(a.character, a.characterClass || (winRoll && winRoll.cls), a.characterId) : null;
    if(w){
      w.wins++;
      if(isOS) w.osWins++;
      if(rolls.length >= 4) w.bigWins++;   // sniper: won against a real crowd
      w.wonItems.add(itemKey(a));          // magpie: distinct items, not total wins
    }

    // Every drop that drew a roll, and how many it drew, cumulated for the white whale.
    const ik = itemKey(a);
    const wr = ITEM_ROLLS.get(ik) || { rolls: 0, drops: 0, name: a.itemName, id: a.itemId };
    wr.rolls += rolls.length; wr.drops++; ITEM_ROLLS.set(ik, wr);

    if(rolls.length > (CONTESTED ? CONTESTED.count : 1)){
      CONTESTED = { count: rolls.length, item: a.itemName, itemId: a.itemId,
                    winner: a.disenchanted ? 'the shard pile' : a.character };
    }

    rolls.forEach(r => {
      const c = chr(r.player, r.cls, r.playerId);
      const amt = Number(r.amount);
      c.rolls++;
      if(isFinite(amt)){
        c.sum += amt;
        c.sumSq += amt * amt;
        if(amt === 100) c.hundreds++;
        if(amt === 1) c.ones++;
      }

      const won = winnerKey && String(r.player || '').toLowerCase() === winnerKey;
      if(won){
        c.streak = 0;
        // Beating nobody isn't luck, so a lone bid doesn't count as a steal.
        if(isFinite(amt) && rolls.length > 1 && (!LUCKIEST || amt < LUCKIEST.amount)){
          LUCKIEST = { amount: amt, char: c, item: a.itemName, itemId: a.itemId, field: rolls.length };
        }
      }else{
        c.losses++;
        c.streak++;
        if(c.streak > c.worstStreak) c.worstStreak = c.streak;
        // A 90-something that still lost — one for the 99 club.
        if(isFinite(amt) && amt >= 90) c.nearMiss++;
        if(winnerKey){
          const loserKey = String(r.player || '').toLowerCase();
          c.lostTo.set(winnerKey, (c.lostTo.get(winnerKey) || 0) + 1);
          w.victims.add(loserKey);         // taxman: the winner's breadth of victims
          // Head-to-head tally, keyed on the unordered pair, for the rivalry record.
          if(loserKey && loserKey !== winnerKey){
            const pk = [winnerKey, loserKey].sort().join('|');
            const h = H2H.get(pk) || {};
            h[winnerKey] = (h[winnerKey] || 0) + 1;
            H2H.set(pk, h);
          }
        }
      }
    });
  });
}

/* ───────────────────────── Cards ─────────────────────────
   A card is either a leaderboard (value + optional per-entry detail, ranked) or
   a one-off record rendered by hand. `min` guards the rate-based boards so one
   lucky first-ever roll can't crown someone with a 100% win rate. */
function board(opts){
  const list = [...CHARS.values()]
    .filter(c => !opts.eligible || opts.eligible(c))
    .map(c => ({ c: c, v: opts.value(c) }))
    .filter(e => isFinite(e.v) && (opts.keepZero || e.v > 0))
    .sort((a,b) => (opts.asc ? a.v - b.v : b.v - a.v));
  return list.slice(0, 3).map(e => ({
    char: e.c,
    value: opts.fmt ? opts.fmt(e.v, e.c) : String(e.v),
    detail: opts.detail ? opts.detail(e.c, e.v) : ''
  }));
}

function avg(c){ return c.rolls ? c.sum / c.rolls : NaN; }
// Population standard deviation of a roller's own rolls — how wild their swings are.
function std(c){ if(!c.rolls) return NaN; const m = avg(c); return Math.sqrt(Math.max(0, c.sumSq / c.rolls - m * m)); }
function pct(n){ return Math.round(n * 100) + '%'; }
// `many` covers the words a trailing "s" gets wrong (loss → losses).
function plural(n, word, many){ return n + ' ' + (n === 1 ? word : (many || word + 's')); }

// Who has beaten this character the most — resolved late so every name is known.
function nemesis(c){
  let bestKey = null, best = 0;
  c.lostTo.forEach((n, key) => { if(n > best){ best = n; bestKey = key; } });
  return bestKey ? { foe: CHARS.get(bestKey), count: best } : null;
}

function cards(){
  // 5 rolls is the smallest sample where a rate says anything at all.
  const MIN = 5;
  const enough = c => c.rolls >= MIN;
  const out = [];

  out.push({ emoji:'💔', title:'Most rolls lost', blurb:'Turned up, rolled, went home empty-handed. Again.',
    entries: board({ value:c => c.losses, fmt:(v,c) => v,
      detail:(c,v) => plural(c.rolls,'roll') + ' → ' + plural(c.wins,'win') }) });

  out.push({ emoji:'🎯', title:'Most 100s', blurb:'The dice gods pick favourites, and it is these people.',
    entries: board({ value:c => c.hundreds, detail:c => 'in ' + plural(c.rolls,'roll') }) });

  out.push({ emoji:'💀', title:'Most 1s', blurb:'A perfect roll, just upside down.',
    entries: board({ value:c => c.ones, detail:c => 'in ' + plural(c.rolls,'roll') }) });

  out.push({ emoji:'🗑️', title:'Most off-spec pieces', blurb:'"It\'s only OS, I swear" — someone, every single week.',
    entries: board({ value:c => c.osWins, detail:c => 'of ' + plural(c.wins,'item') + ' won' }) });

  out.push({ emoji:'🏆', title:'Most items won', blurb:'Statistically, they are wearing your gear.',
    entries: board({ value:c => c.wins, detail:c => 'from ' + plural(c.rolls,'roll') }) });

  out.push({ emoji:'🤲', title:'Greediest', blurb:'Rolls on everything. Absolutely everything.',
    entries: board({ value:c => c.rolls, detail:c => plural(c.wins,'win') + ', ' + plural(c.losses,'loss','losses') }) });

  out.push({ emoji:'📉', title:'Worst average roll', blurb:'Cursed. There is no other explanation.',
    entries: board({ eligible:enough, value:avg, asc:true, fmt:v => v.toFixed(1),
      detail:c => 'over ' + plural(c.rolls,'roll') }) });

  out.push({ emoji:'📈', title:'Suspiciously good average', blurb:'Nobody is accusing anyone of anything.',
    entries: board({ eligible:enough, value:avg, fmt:v => v.toFixed(1),
      detail:c => 'over ' + plural(c.rolls,'roll') }) });

  out.push({ emoji:'🥈', title:'Perpetual bridesmaid', blurb:'Worst win rate of anyone who rolls regularly.',
    entries: board({ eligible:enough, value:c => c.wins / c.rolls, asc:true, keepZero:true, fmt:pct,
      detail:c => plural(c.wins,'win') + ' from ' + plural(c.rolls,'roll') }) });

  out.push({ emoji:'🍀', title:'Best win rate', blurb:'Same raid, same boss, completely different luck.',
    entries: board({ eligible:enough, value:c => c.wins / c.rolls, fmt:pct,
      detail:c => plural(c.wins,'win') + ' from ' + plural(c.rolls,'roll') }) });

  out.push({ emoji:'🌵', title:'Longest dry spell', blurb:'Consecutive losing rolls without a single win in between.',
    entries: board({ value:c => c.worstStreak, fmt:v => plural(v,'loss','losses'),
      detail:c => c.wins ? 'they did eventually win ' + plural(c.wins,'item') : 'still never won anything' }) });

  out.push({ emoji:'😤', title:'Biggest nemesis', blurb:'The one person who keeps taking their loot.',
    entries: board({
      value:c => { const n = nemesis(c); return n ? n.count : 0; },
      fmt:(v,c) => plural(v,'time'),
      detail:c => { const n = nemesis(c); return n ? 'beaten by ' + n.foe.name : ''; } }) });

  out.push({ emoji:'🎢', title:'Feast or famine', blurb:'No middle gear. A 97 or a 4, and nothing in between.',
    entries: board({ eligible:enough, value:std, fmt:v => '±' + v.toFixed(1),
      detail:c => 'over ' + plural(c.rolls,'roll') }) });

  out.push({ emoji:'📏', title:'Old reliable', blurb:'Rolls the same number every week, with grim certainty.',
    entries: board({ eligible:enough, value:std, asc:true, fmt:v => '±' + v.toFixed(1),
      detail:c => 'over ' + plural(c.rolls,'roll') }) });

  out.push({ emoji:'😩', title:'The 99 club', blurb:'A 90-something, and it still wasn\'t enough. Again.',
    entries: board({ value:c => c.nearMiss,
      detail:c => 'of ' + plural(c.losses,'loss','losses') }) });

  out.push({ emoji:'🧛', title:'The taxman', blurb:'Everyone pays, sooner or later. No exemptions.',
    entries: board({ value:c => c.victims.size, fmt:v => plural(v,'victim'),
      detail:c => 'across ' + plural(c.wins,'win') }) });

  out.push({ emoji:'🔭', title:'The sniper', blurb:'Waits for a crowd to gather, then walks off with it.',
    entries: board({ value:c => c.bigWins,
      detail:c => 'of ' + plural(c.wins,'win') + ' won' }) });

  out.push({ emoji:'🎒', title:'The magpie', blurb:'Not the most items — the most different ones. A collection.',
    entries: board({ value:c => c.wonItems.size, fmt:v => plural(v,'item'),
      detail:c => 'from ' + plural(c.wins,'win') }) });

  return out;
}

function entryHtml(e, i){
  if(i === 0){
    return '<div class="ls-top"><span class="ls-name">' + nameHtml(e.char) + '</span>' +
           '<span class="ls-value">' + esc(e.value) + '</span></div>' +
           (e.detail ? '<div class="ls-detail">' + esc(e.detail) + '</div>' : '');
  }
  return '<li><span class="rank">' + (i + 1) + '.</span>' + nameHtml(e.char) +
         '<span class="val">' + esc(e.value) + '</span></li>';
}

function cardHtml(c){
  const head = '<h2><span class="ls-emoji">' + c.emoji + '</span>' + esc(c.title) + '</h2>' +
               '<p class="ls-blurb">' + c.blurb + '</p>';
  if(c.html) return '<div class="ls-card">' + head + c.html + '</div>';
  if(!c.entries.length) return '<div class="ls-card">' + head + '<div class="ls-none">Not enough data yet.</div></div>';
  const rest = c.entries.slice(1);
  return '<div class="ls-card">' + head + entryHtml(c.entries[0], 0) +
    (rest.length ? '<ul class="ls-rest">' + rest.map((e, i) => entryHtml(e, i + 1)).join('') + '</ul>' : '') +
    '</div>';
}

// The story cards: one number each, but the interesting part is the item.
function recordCards(){
  const out = [];
  if(LUCKIEST){
    out.push({ emoji:'🎲', title:'Cheekiest win', blurb:'The lowest roll that somehow still won a contested item.',
      html:'<div class="ls-top"><span class="ls-name">' + nameHtml(LUCKIEST.char) + '</span>' +
           '<span class="ls-value">' + LUCKIEST.amount + '</span></div>' +
           '<div class="ls-detail">won ' + itemLink(LUCKIEST.itemId, LUCKIEST.item) + ' against ' + (LUCKIEST.field - 1) +
           ' other ' + (LUCKIEST.field === 2 ? 'roller' : 'rollers') + '</div>' });
  }
  if(CONTESTED){
    out.push({ emoji:'⚔️', title:'Most contested item', blurb:'The item that started the most arguments.',
      html:'<div class="ls-top"><span class="ls-name">' + itemLink(CONTESTED.itemId, CONTESTED.item) + '</span>' +
           '<span class="ls-value">' + CONTESTED.count + '</span></div>' +
           '<div class="ls-detail">rolls — it went to ' + esc(CONTESTED.winner || 'nobody') + '</div>' });
  }

  // Bitterest rivalry — the pair who have contested each other the most, and the split.
  let riv = null;
  H2H.forEach((h, pk) => {
    const parts = pk.split('|');
    const total = (h[parts[0]] || 0) + (h[parts[1]] || 0);
    if(!riv || total > riv.total) riv = { total, a: parts[0], b: parts[1], av: h[parts[0]] || 0, bv: h[parts[1]] || 0 };
  });
  if(riv && riv.total >= 4){
    const aLeads = riv.av >= riv.bv;
    const hiC = CHARS.get(aLeads ? riv.a : riv.b), loC = CHARS.get(aLeads ? riv.b : riv.a);
    const hiN = aLeads ? riv.av : riv.bv, loN = aLeads ? riv.bv : riv.av;
    out.push({ emoji:'🥊', title:'Bitterest rivalry', blurb:'Two names that turn up in each other\'s losses again and again.',
      html:'<div class="ls-top"><span class="ls-name">' + nameHtml(hiC) + '</span>' +
           '<span class="ls-value">' + hiN + '–' + loN + '</span></div>' +
           '<div class="ls-detail">over ' + nameHtml(loC) + ', across ' + plural(riv.total,'contest') + '</div>' });
  }

  // The generous hand — the master looter who has handed out the most, with runners-up.
  const looters = [...LOOTERS.entries()].map(e => ({ name: e[0], count: e[1] }))
    .sort((a, b) => b.count - a.count).slice(0, 4);
  if(looters.length && looters[0].count > 0){
    const rest = looters.slice(1);
    out.push({ emoji:'🎅', title:'The generous hand', blurb:'Hands out everyone else\'s loot all night. A saint, allegedly.',
      html:'<div class="ls-top"><span class="ls-name">' + knownName(looters[0].name) + '</span>' +
           '<span class="ls-value">' + looters[0].count + '</span></div>' +
           '<div class="ls-detail">' + plural(looters[0].count,'item') + ' handed out</div>' +
           (rest.length ? '<ul class="ls-rest">' + rest.map((l, i) =>
             '<li><span class="rank">' + (i + 2) + '.</span>' + knownName(l.name) +
             '<span class="val">' + l.count + '</span></li>').join('') + '</ul>' : '') });
  }

  // Teacher's pet — the winner who took the most from one particular master looter.
  let pet = null;
  GIFTS.forEach(g => { if(!pet || g.count > pet.count) pet = g; });
  if(pet && pet.count >= 3){
    out.push({ emoji:'🐶', title:'Teacher\'s pet', blurb:'Nobody is accusing anyone of anything. Just noting it down.',
      html:'<div class="ls-top"><span class="ls-name">' + knownName(pet.winner) + '</span>' +
           '<span class="ls-value">' + pet.count + '</span></div>' +
           '<div class="ls-detail">' + plural(pet.count,'item') + ' from ' + knownName(pet.looter) + '</div>' });
  }

  // Busiest loot night — the single night the boss table gave up entirely.
  let night = null;
  NIGHTS.forEach((count, day) => { if(!night || count > night.count) night = { day, count }; });
  if(night && night.count > 1){
    const d = new Date(night.day + 'T00:00:00');
    const label = isNaN(d) ? night.day : d.toLocaleDateString(undefined, { weekday:'short', day:'numeric', month:'short', year:'numeric' });
    out.push({ emoji:'📅', title:'Busiest loot night', blurb:'The night the loot simply would not stop coming.',
      html:'<div class="ls-top"><span class="ls-name">' + esc(label) + '</span>' +
           '<span class="ls-value">' + night.count + '</span></div>' +
           '<div class="ls-detail">' + plural(night.count,'item') + ' awarded in one night</div>' });
  }

  // Shard bait — the item nobody wanted, disenchanted the most.
  let shard = null;
  DE_ITEMS.forEach(d => { if(!shard || d.count > shard.count) shard = d; });
  if(shard && shard.count > 1){
    out.push({ emoji:'🧲', title:'Shard bait', blurb:'Dropped and dropped, and wanted by absolutely no one.',
      html:'<div class="ls-top"><span class="ls-name">' + itemLink(shard.id, shard.name) + '</span>' +
           '<span class="ls-value">' + shard.count + '</span></div>' +
           '<div class="ls-detail">disenchanted ' + plural(shard.count,'time') + '</div>' });
  }

  // The white whale — the item the guild keeps fighting over, night after night. Needs
  // more than one drop, or it's just the most-contested item under another name.
  let whale = null;
  ITEM_ROLLS.forEach(w => { if(w.drops >= 2 && (!whale || w.rolls > whale.rolls)) whale = w; });
  if(whale){
    out.push({ emoji:'🐋', title:'The white whale', blurb:'The item the guild has fought over the most, drop after drop.',
      html:'<div class="ls-top"><span class="ls-name">' + itemLink(whale.id, whale.name) + '</span>' +
           '<span class="ls-value">' + whale.rolls + '</span></div>' +
           '<div class="ls-detail">rolls across ' + plural(whale.drops,'drop') + '</div>' });
  }

  return out;
}

function summaryHtml(){
  const rollers = [...CHARS.values()].filter(c => c.rolls > 0).length;
  return [
    ['Items rolled for', TOTALS.awards],
    ['Rolls placed', TOTALS.rolls],
    ['Characters rolling', rollers],
    ['Disenchanted', TOTALS.de]
  ].map(p => '<div><b>' + p[1] + '</b>' + p[0] + '</div>').join('');
}

function render(){
  const all = cards().concat(recordCards());
  document.getElementById('grid').innerHTML = all.map(cardHtml).join('');
  const s = document.getElementById('summary');
  s.innerHTML = summaryHtml();
  s.style.display = '';
  document.getElementById('msg').style.display = 'none';
  loadWowhead(); // the story cards carry item links
}

function fail(text){
  document.getElementById('msg').textContent = text;
}

async function load(){
  try{
    const res = await fetch(API_BASE + '/api/loot/history', { headers:{ 'Authorization':'Bearer ' + sessionToken() } });
    if(res.status === 401){
      fail('Session expired — signing out…');
      setTimeout(logout, 1200);
      return;
    }
    if(!res.ok){ fail('Could not load loot (HTTP ' + res.status + ').'); return; }
    const rows = await res.json();
    if(!rows.length){ fail('No loot has been recorded yet — nothing to be smug about.'); return; }
    aggregate(rows);
    render();
  }catch(err){
    fail('Could not reach the guild database.');
  }
}

load();
</script>
