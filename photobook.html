<script>
/* Officer gate while the photobook is tried out. Hiding the page is only cosmetic: every
   /api/photos route is officer-gated on the API regardless. A member who lands here is sent
   to the WoW Forever home. */
(function(){
  function payload(tok){
    if(!tok) return null;
    try{
      var p = tok.split('.')[0].replace(/-/g,'+').replace(/_/g,'/');
      while(p.length % 4) p += '=';
      return JSON.parse(atob(p));
    }catch(e){ return null; }
  }
  var tok = null;
  try{ tok = localStorage.getItem('vashj_session'); }catch(e){}
  var p = payload(tok);
  if(!p || !p.exp || p.exp <= Math.floor(Date.now()/1000)){
    try{ localStorage.removeItem('vashj_session'); }catch(e){}
    location.replace('index.html');
  }else if(!p.officer){
    location.replace('forever-home.html');
  }
})();
</script>

<script>
// API_BASE, sessionToken and logout come from menu.js. The image routes want a Bearer token,
// so images are fetched and shown as object URLs rather than linked directly.

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

async function api(path, opts){
  const o = Object.assign({}, opts);
  o.headers = Object.assign({ 'Authorization': 'Bearer ' + sessionToken() }, o.headers || {});
  const res = await fetch(API_BASE + path, o);
  if(res.status === 401){ setStatus('Session expired — signing out…', 'err'); setTimeout(logout, 1200); throw new Error('401'); }
  return res;
}
async function errorDetail(res){
  try{ const j = await res.json(); return j.detail || ('HTTP ' + res.status); }catch(e){ return 'HTTP ' + res.status; }
}

function setStatus(msg, kind, id){
  const el = document.getElementById(id || 'status');
  el.textContent = msg || '';
  el.className = 'apply-status' + (kind ? ' ' + kind : '');
}

function when(iso){
  const d = new Date(iso);
  return isNaN(d) ? '' : d.toLocaleString(undefined, { dateStyle:'medium', timeStyle:'short' });
}

let tab = 'approved', tagFilter = null, photos = [], vocab = [], rejections = [];
const imageUrls = {};   // "id:thumb" → object URL, so re-renders don't refetch

const tagLabel = id => (vocab.find(t => t.id === id) || { label:id }).label;

async function imageUrl(id, kind){
  const key = id + ':' + kind;
  if(!imageUrls[key]){
    imageUrls[key] = api('/api/photos/' + id + '/' + kind)
      .then(r => r.ok ? r.blob() : null)
      .then(b => b ? URL.createObjectURL(b) : '');
  }
  return imageUrls[key];
}

// ── Upload: resize and re-encode in the browser ─────────────────────────────────────────────
// Re-encoding through a canvas as JPEG drops the EXIF block, GPS included, and keeps uploads
// small. imageOrientation honours a phone's rotation flag before it's thrown away.
const FULL_MAX = 1600, THUMB_MAX = 480;

function drawScaled(bitmap, max){
  const scale = Math.min(1, max / Math.max(bitmap.width, bitmap.height));
  const c = document.createElement('canvas');
  c.width = Math.round(bitmap.width * scale);
  c.height = Math.round(bitmap.height * scale);
  c.getContext('2d').drawImage(bitmap, 0, 0, c.width, c.height);
  return c;
}
const toJpeg = (canvas, q) => new Promise((ok, bad) =>
  canvas.toBlob(b => b ? ok(b) : bad(new Error('encode')), 'image/jpeg', q));
const toBase64 = blob => new Promise((ok, bad) => {
  const r = new FileReader();
  r.onload = () => ok(String(r.result).split(',')[1]);
  r.onerror = () => bad(r.error);
  r.readAsDataURL(blob);
});

// ── The upload dialog ───────────────────────────────────────────────────────────────────────
// Opened by the button, or by dropping or pasting an image anywhere on the page, which opens it
// with that image already chosen. It lands in pendingFile and shows as a preview in the drop
// box, so the caption can be written before uploading.
let pendingFile = null, previewUrl = null, uploading = false, openedByDrag = false;
const drop = document.getElementById('drop');
const uploadModal = document.getElementById('uploadModal');
const uStatus = (msg, kind) => setStatus(msg, kind, 'uStatus');

function openUpload(){
  openedByDrag = false;
  if(!uploadModal.hidden) return;
  if(!modal.hidden) closeModal();   // one dialog at a time
  uStatus('');
  uploadModal.hidden = false;
}

function closeUpload(){
  if(uploading) return;             // the request is in flight; let it land
  uploadModal.hidden = true;
  openedByDrag = false;
  document.getElementById('upload').reset();
  clearChosen();
  uStatus('');
  document.getElementById('openUpload').focus();
}

document.getElementById('openUpload').addEventListener('click', openUpload);
document.getElementById('uCancel').addEventListener('click', closeUpload);
uploadModal.addEventListener('click', e => { if(e.target === uploadModal) closeUpload(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape' && !uploadModal.hidden) closeUpload(); });

function choose(file){
  if(!file) return;
  openUpload();
  if(!/^image\//.test(file.type)){ uStatus("That isn't an image.", 'err'); return; }
  pendingFile = file;
  if(previewUrl) URL.revokeObjectURL(previewUrl);
  previewUrl = URL.createObjectURL(file);
  const img = document.getElementById('dropPreview');
  img.src = previewUrl;
  img.hidden = false;
  document.getElementById('dropTitle').textContent = file.name && file.name !== 'image.png' ? file.name : 'Pasted image';
  document.getElementById('dropHint').innerHTML = matchMedia('(pointer: coarse)').matches
    ? 'Ready to upload · tap to swap it'
    : 'Ready to upload · drop, paste or <u>browse</u> to swap it';
  document.getElementById('uploadBtn').disabled = false;
  uStatus('');
  document.getElementById('caption').focus();
}

function clearChosen(){
  pendingFile = null;
  if(previewUrl) URL.revokeObjectURL(previewUrl);
  previewUrl = null;
  const img = document.getElementById('dropPreview');
  img.hidden = true;
  img.removeAttribute('src');
  idleCopy();
  document.getElementById('uploadBtn').disabled = true;
}

// A phone can't drag files in or paste with Ctrl+V, so a touch screen gets a tap prompt.
function idleCopy(){
  const touch = matchMedia('(pointer: coarse)').matches;
  document.getElementById('dropTitle').textContent = touch ? 'Tap to choose a photo' : 'Drop an image here';
  document.getElementById('dropHint').innerHTML = touch
    ? 'or take a screenshot and pick it from your gallery'
    : 'or paste one (<kbd>Ctrl</kbd>+<kbd>V</kbd>), or <u>browse</u>';
}
idleCopy();

const firstImage = list => [...(list || [])].find(f => /^image\//.test(f.type));
const hasFiles = e => e.dataTransfer && [...e.dataTransfer.types].indexOf('Files') !== -1;

document.getElementById('file').addEventListener('change', function(){
  choose(this.files[0]);
  this.value = '';   // so picking the same file again still fires
});

// The whole page is a drop target, so a near miss doesn't open the image in the tab instead.
// Dragging a file in opens the dialog, so the drop box is there to aim at; dragging back out
// without letting go closes it again, unless it was already open. dragenter/leave fire for
// every child crossed, hence the depth count.
let dragDepth = 0;
window.addEventListener('dragenter', function(e){
  if(!hasFiles(e)) return;
  e.preventDefault();
  if(dragDepth++ === 0){
    document.body.classList.add('dragging');
    if(uploadModal.hidden && !uploading){ openUpload(); openedByDrag = true; }
  }
});
window.addEventListener('dragleave', function(e){
  if(!hasFiles(e)) return;
  if(--dragDepth <= 0){
    dragDepth = 0;
    document.body.classList.remove('dragging');
    drop.classList.remove('over');
    if(openedByDrag && !pendingFile) closeUpload();
  }
});
window.addEventListener('dragover', function(e){
  if(!hasFiles(e)) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'copy';
  drop.classList.toggle('over', drop.contains(e.target));
});
window.addEventListener('drop', function(e){
  if(!hasFiles(e)) return;
  e.preventDefault();
  dragDepth = 0;
  document.body.classList.remove('dragging');
  drop.classList.remove('over');
  const file = firstImage(e.dataTransfer.files);
  if(file) choose(file);
  else { openUpload(); uStatus("That isn't an image.", 'err'); }
});

// Paste: only an image on the clipboard is taken, so pasting text into a caption still works.
// Ignored while the lightbox is open, where a paste is meant for its caption box.
document.addEventListener('paste', function(e){
  if(!modal.hidden || uploading) return;
  const file = firstImage(e.clipboardData && e.clipboardData.files);
  if(!file) return;
  e.preventDefault();
  choose(file);
});

document.getElementById('upload').addEventListener('submit', async function(e){
  e.preventDefault();
  const file = pendingFile;
  if(!file){ uStatus('Drop, paste or browse for an image first.', 'err'); return; }
  const btn = document.getElementById('uploadBtn'), cancel = document.getElementById('uCancel');
  btn.disabled = cancel.disabled = true;
  uploading = true;
  try{
    uStatus('Preparing…');
    let bitmap;
    try{ bitmap = await createImageBitmap(file, { imageOrientation:'from-image' }); }
    catch(err){ uStatus("That file couldn't be read as an image.", 'err'); return; }
    const full = drawScaled(bitmap, FULL_MAX), thumb = drawScaled(bitmap, THUMB_MAX);
    const body = {
      image: await toBase64(await toJpeg(full, 0.85)),
      thumb: await toBase64(await toJpeg(thumb, 0.8)),
      caption: document.getElementById('caption').value.trim(),
      width: full.width, height: full.height
    };
    uStatus('Checking and tagging…');
    const res = await api('/api/photos', {
      method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify(body)
    });
    if(!res.ok){
      // The dialog stays open on a refusal, so the uploader reads why and can pick another.
      uStatus(await errorDetail(res), 'err');
      if(res.status === 422) load();
      return;
    }
    const p = await res.json();
    uploading = false;
    closeUpload();
    setStatus(p.status === 'pending'
      ? 'Uploaded, but held for review: ' + ((p.moderation && p.moderation.reason) || 'needs an officer to look.')
      : 'Uploaded' + (p.tags.length ? ' and tagged ' + p.tags.map(tagLabel).join(', ') + '.' : '.'), 'ok');
    tab = p.status;
    await load();
  }catch(err){
    if(String(err.message) !== '401') uStatus('Upload failed — could not reach the guild database.', 'err');
  }finally{
    uploading = false;
    btn.disabled = !pendingFile;
    cancel.disabled = false;
  }
});

// ── Book ────────────────────────────────────────────────────────────────────────────────────
let shownList = [];   // what the grid is showing, in order — the lightbox steps through this

const ratio = p => (p.width > 0 && p.height > 0) ? p.width / p.height : 4 / 3;

function tile(p){
  const cap = p.caption || '';
  const r = ratio(p).toFixed(4);
  return '<button type="button" class="photo-tile" data-id="' + esc(p.id) + '" data-r="' + r + '" style="--r:' + r + '"' +
      ' aria-label="' + esc(cap || p.altText || 'Photo') + ' — by ' + esc(p.uploaderName) + '">' +
    '<img class="thumb" draggable="false" data-thumb="' + esc(p.id) + '" alt="' + esc(p.altText || cap || 'Photo') + '">' +
    (p.status === 'pending' ? '<span class="photo-badge">Held for review</span>' : '') +
    '<span class="ov">' +
      (cap ? '<span class="cap">' + esc(cap) + '</span>' : '') +
      '<span class="by">' + esc(p.uploaderName) + ' · ' + esc(shortDate(p.createdAt)) + '</span>' +
    '</span></button>';
}

function shortDate(iso){
  const d = new Date(iso);
  return isNaN(d) ? '' : d.toLocaleDateString(undefined, { day:'numeric', month:'short' });
}

// Justified rows: fill each row with photos until, scaled to share the width exactly, the row
// would be no taller than the target height, then size it so. Rows are never taller than the
// target, so one wide photo that won't fit can't inflate the rest of its row. The last row
// can't fill the width without being too tall, so it stays at the target height, left-aligned.
const GAP = 8;
const rowTarget = () => Math.max(110, Math.min(240, innerWidth * 0.22));

function justify(){
  const target = rowTarget();
  document.querySelectorAll('#grid .photo-justify').forEach(function(block){
    const W = block.clientWidth;
    if(!W) return;
    const tiles = [...block.children];
    let row = [], sum = 0;
    const place = (h, full) => row.forEach(function(t, i){
      // A full row's last tile takes up the rounding, so the row ends flush on the right.
      const w = full && i === row.length - 1
        ? W - row.slice(0, -1).reduce((s, x) => s + parseFloat(x.style.width) + GAP, 0)
        : Math.floor(+t.dataset.r * h * 100) / 100;
      t.style.width = Math.min(w, W) + 'px';
      t.style.height = Math.floor(h * 100) / 100 + 'px';
    });
    tiles.forEach(function(t){
      row.push(t);
      sum += +t.dataset.r;
      const h = (W - GAP * (row.length - 1)) / sum;
      if(h <= target){ place(h, true); row = []; sum = 0; }
    });
    if(row.length) place(target, false);
  });
}
// Re-justify whenever the grid's width changes — a resize, or a scrollbar appearing once the
// photos have made the page tall enough to scroll.
let justifyFrame = 0, gridWidth = 0;
new ResizeObserver(function(entries){
  const w = Math.round(entries[0].contentRect.width);
  if(w === gridWidth) return;
  gridWidth = w;
  cancelAnimationFrame(justifyFrame);
  justifyFrame = requestAnimationFrame(justify);
}).observe(document.getElementById('grid'));

// Newest first, grouped under a heading per month.
function monthGroups(list){
  const groups = [];
  list.forEach(function(p){
    const d = new Date(p.createdAt);
    const key = isNaN(d) ? '' : d.getFullYear() + '-' + d.getMonth();
    let g = groups[groups.length - 1];
    if(!g || g.key !== key){
      g = { key, label: isNaN(d) ? 'Undated' : d.toLocaleDateString(undefined, { month:'long', year:'numeric' }), items: [] };
      groups.push(g);
    }
    g.items.push(p);
  });
  return groups;
}

// ── Rejected: what the content check refused, and who tried ─────────────────────────────────
// OpenAI's category ids are things like "violence/graphic"; spaced out, they read well enough.
const catLabel = c => String(c).replace(/\//g, ' / ').replace(/-/g, ' ');

function rejectionCard(r){
  const scores = (r.scores || []).map(s => catLabel(s.category) + ' ' + Number(s.score).toFixed(2)).join(' · ');
  return '<article class="reject-card" data-id="' + esc(r.id) + '">' +
    '<div class="reject-body">' +
      '<div><span class="reject-who">' + esc(r.uploaderName || r.uploaderUid) + '</span>' +
        '<span class="reject-kind">' + (r.kind === 'caption' ? 'Caption edit refused' : 'Upload refused') + '</span></div>' +
      '<div class="review-when">' + esc(when(r.createdAt)) + '</div>' +
      (r.categories.length ? '<div class="tag-chips">' + r.categories.map(c => '<span class="tag-chip flag">' + esc(catLabel(c)) + '</span>').join('') + '</div>' : '') +
      '<p class="reject-caption">' + (r.caption ? '“' + esc(r.caption) + '”' : '<span class="review-none">No caption</span>') + '</p>' +
      (scores ? '<div class="reject-scores">Top scores: ' + esc(scores) + '</div>' : '') +
    '</div>' +
    '<button type="button" class="btn-ghost reject-dismiss">Dismiss</button>' +
  '</article>';
}

function renderRejections(){
  const el = document.getElementById('rejections');
  el.innerHTML = rejections.length
    ? '<p class="reject-note">Everything the content check refused, newest first. The image itself is never kept — only who tried, the caption, and why. Dismiss one once it has been dealt with.</p>' +
      rejections.map(rejectionCard).join('')
    : '<p class="review-none">Nothing has been refused.</p>';
}

function render(){
  document.querySelectorAll('#tabs .launch-filter').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  const rejectedTab = tab === 'rejected';
  document.getElementById('grid').hidden = rejectedTab;
  document.getElementById('tagFilters').hidden = rejectedTab;
  document.getElementById('rejections').hidden = !rejectedTab;
  if(rejectedTab){ renderRejections(); return; }
  document.getElementById('grid').classList.toggle('photo-grid', !rejectedTab);
  // Only the tags actually in use on this tab, with counts.
  const counts = {};
  photos.forEach(p => p.tags.forEach(t => counts[t] = (counts[t] || 0) + 1));
  if(tagFilter && !counts[tagFilter]) tagFilter = null;
  const used = vocab.filter(t => counts[t.id]);
  document.getElementById('tagFilters').innerHTML = used.length
    ? '<button type="button" class="launch-filter' + (tagFilter ? '' : ' active') + '" data-tag="">All <b>' + photos.length + '</b></button>' +
      used.map(t => '<button type="button" class="launch-filter' + (tagFilter === t.id ? ' active' : '') + '" data-tag="' + esc(t.id) + '">' +
        esc(t.label) + ' <b>' + counts[t.id] + '</b></button>').join('')
    : '';

  const shown = photos.filter(p => !tagFilter || p.tags.indexOf(tagFilter) !== -1);
  shownList = shown;
  const grid = document.getElementById('grid');
  grid.innerHTML = shown.length
    ? monthGroups(shown).map(g =>
        '<h3 class="photo-month">' + esc(g.label) + ' <span>' + g.items.length + (g.items.length === 1 ? ' photo' : ' photos') + '</span></h3>' +
        '<div class="photo-justify">' + g.items.map(tile).join('') + '</div>').join('')
    : (tab === 'pending'
        ? '<div class="photo-empty"><b>All clear</b>Nothing is waiting for review.</div>'
        : '<div class="photo-empty"><b>No photos yet</b>Be the first — drop a screenshot anywhere on this page.</div>');
  justify();
  grid.querySelectorAll('img[data-thumb]').forEach(async img => {
    img.addEventListener('load', () => img.closest('.photo-tile').classList.add('loaded'), { once:true });
    img.src = await imageUrl(img.dataset.thumb, 'thumb');
  });
}

async function load(){
  try{
    // The book's list also carries both counts, so it's fetched on every tab.
    const [res, rej] = await Promise.all([
      api('/api/photos' + (tab === 'pending' ? '?status=pending' : '')),
      tab === 'rejected' ? api('/api/photos/rejections') : null
    ]);
    if(res.status === 403){ setStatus('Officers only.', 'err'); return; }
    if(!res.ok){ setStatus('Could not load the photobook (' + await errorDetail(res) + ').', 'err'); return; }
    if(rej && !rej.ok){ setStatus('Could not load the rejections (' + await errorDetail(rej) + ').', 'err'); return; }
    const data = await res.json();
    vocab = data.tags || [];
    photos = tab === 'rejected' ? [] : (data.photos || []);
    if(rej) rejections = (await rej.json()).rejections || [];
    document.getElementById('pendingCount').textContent = data.pending;
    document.getElementById('rejectedCount').textContent = data.rejected;
    render();
  }catch(err){
    if(String(err.message) !== '401') setStatus('Could not reach the guild database.', 'err');
  }
}

document.getElementById('tabs').addEventListener('click', function(e){
  const b = e.target.closest('[data-tab]');
  if(!b || b.dataset.tab === tab) return;
  tab = b.dataset.tab; tagFilter = null;
  setStatus('');
  load();
});
document.getElementById('rejections').addEventListener('click', async function(e){
  const btn = e.target.closest('.reject-dismiss');
  if(!btn) return;
  const id = btn.closest('.reject-card').dataset.id;
  btn.disabled = true;
  try{
    const res = await api('/api/photos/rejections/' + encodeURIComponent(id), { method:'DELETE' });
    if(!res.ok && res.status !== 404){ setStatus('Could not dismiss (' + await errorDetail(res) + ').', 'err'); btn.disabled = false; return; }
    await load();
  }catch(err){
    if(String(err.message) !== '401') setStatus('Could not reach the guild database.', 'err');
    btn.disabled = false;
  }
});

document.getElementById('tagFilters').addEventListener('click', function(e){
  const b = e.target.closest('[data-tag]');
  if(!b) return;
  tagFilter = b.dataset.tag || null;
  render();
});

// ── Lightbox: view, step through, edit, approve, delete ─────────────────────────────────────
const modal = document.getElementById('modal');
let current = null, editTags = [], lastFocus = null;
const $ = id => document.getElementById(id);

function renderModalTags(){
  $('mTags').innerHTML = vocab.map(t =>
    '<button type="button" class="tag-chip' + (editTags.indexOf(t.id) !== -1 ? ' on' : '') + '" data-tag="' + esc(t.id) + '">' +
      esc(t.label) + '</button>').join('');
}

function setEditing(on){
  $('mView').hidden = on;
  $('mEdit').hidden = !on;
  $('mEditBtn').hidden = on;
  $('mSave').hidden = $('mCancelEdit').hidden = !on;
  if(on){
    editTags = current.tags.slice();
    $('mCaption').value = current.caption || '';
    renderModalTags();
    $('mCaption').focus();
  }
}

function fillPanel(p){
  const title = $('mTitle');
  title.textContent = p.caption || 'Untitled';
  title.classList.toggle('untitled', !p.caption);
  $('mAvatar').textContent = (p.uploaderName || '?').trim().charAt(0).toUpperCase();
  $('mWho').textContent = p.uploaderName;
  $('mWhen').textContent = when(p.createdAt);
  $('mHeld').hidden = p.status !== 'pending';
  $('mHeldWhy').textContent = (p.moderation && p.moderation.reason) || 'Waiting for an officer.';
  // Tags link back into the grid's filter.
  $('mTagsView').innerHTML = p.tags.map(t => '<a href="#" class="tag-chip" data-filter-tag="' + esc(t) + '">' + esc(tagLabel(t)) + '</a>').join('');
  $('mTagsBlock').hidden = !p.tags.length;
  $('mAlt').textContent = p.altText || '';
  $('mAltBlock').hidden = !p.altText;
  const m = p.moderation || {}, top = (m.top || [])[0];
  $('mFacts').innerHTML =
    esc(p.width + ' × ' + p.height) + '<br>' +
    (m.checked
      ? 'Content check passed' + (top ? ' · highest score ' + esc(catLabel(top.category)) + ' ' + Number(top.score).toFixed(3) : '')
      : 'Content check did not run');
}

async function showImage(p){
  const img = $('mImg');
  img.alt = p.altText || p.caption || 'Photo';
  // The thumbnail is already loaded, so show it at once, softened, then sharpen to the full image.
  img.classList.add('swap');
  const thumb = await imageUrl(p.id, 'thumb');
  if(current !== p) return;
  img.src = thumb;
  img.classList.add('soft');
  img.classList.remove('swap');
  const full = await imageUrl(p.id, 'full');
  if(current !== p || !full) return;
  const pre = new Image();
  pre.onload = () => { if(current === p){ img.src = full; img.classList.remove('soft'); } };
  pre.src = full;
  // Warm the neighbours so stepping is instant.
  const i = shownList.indexOf(p);
  [shownList[i - 1], shownList[i + 1]].forEach(n => { if(n) imageUrl(n.id, 'full'); });
}

function openPhoto(p){
  if(modal.hidden) lastFocus = document.activeElement;
  current = p;
  const i = shownList.indexOf(p), n = shownList.length;
  $('mCount').textContent = i >= 0 && n > 1 ? (i + 1) + ' / ' + n : '';
  $('mPrev').hidden = i <= 0;
  $('mNext').hidden = i < 0 || i >= n - 1;
  setStatus('', null, 'mStatus');
  setEditing(false);
  fillPanel(p);
  modal.hidden = false;
  document.body.style.overflow = 'hidden';
  showImage(p);
  if(!modal.contains(document.activeElement)) $('mClose').focus();
}

function step(d){
  if(!current || !$('mEdit').hidden) return;
  const next = shownList[shownList.indexOf(current) + d];
  if(next) openPhoto(next);
}

function closeModal(){
  modal.hidden = true;
  current = null;
  document.body.style.overflow = '';
  if(lastFocus && document.contains(lastFocus)) lastFocus.focus();
}

document.getElementById('grid').addEventListener('click', function(e){
  const t = e.target.closest('.photo-tile');
  if(!t) return;
  const p = photos.find(x => x.id === t.dataset.id);
  if(p) openPhoto(p);
});
$('mPrev').addEventListener('click', () => step(-1));
$('mNext').addEventListener('click', () => step(1));
$('mClose').addEventListener('click', closeModal);
// A click on the bare stage, not the photo or a button, closes.
$('mStage').addEventListener('click', e => { if(e.target === e.currentTarget) closeModal(); });
document.addEventListener('keydown', function(e){
  if(modal.hidden) return;
  if(e.key === 'Escape'){ $('mEdit').hidden ? closeModal() : setEditing(false); return; }
  if(/^(TEXTAREA|INPUT)$/.test(document.activeElement.tagName)) return;
  if(e.key === 'ArrowLeft') step(-1);
  if(e.key === 'ArrowRight') step(1);
});
// Swipe on the stage to step.
(function(){
  let x0 = null, y0 = null;
  $('mStage').addEventListener('touchstart', e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive:true });
  $('mStage').addEventListener('touchend', function(e){
    if(x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
    if(Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) step(dx < 0 ? 1 : -1);
    x0 = null;
  });
})();

$('mTagsView').addEventListener('click', function(e){
  const a = e.target.closest('[data-filter-tag]');
  if(!a) return;
  e.preventDefault();
  tagFilter = a.dataset.filterTag;
  closeModal();
  render();
  document.getElementById('tagFilters').scrollIntoView({ behavior:'smooth', block:'start' });
});
$('mTags').addEventListener('click', function(e){
  const b = e.target.closest('[data-tag]');
  if(!b) return;
  const i = editTags.indexOf(b.dataset.tag);
  if(i !== -1) editTags.splice(i, 1);
  else if(editTags.length < 6) editTags.push(b.dataset.tag);
  else { setStatus('Six tags at most.', 'err', 'mStatus'); return; }
  setStatus('', null, 'mStatus');
  renderModalTags();
});
$('mEditBtn').addEventListener('click', () => setEditing(true));
$('mCancelEdit').addEventListener('click', () => { setStatus('', null, 'mStatus'); setEditing(false); });

async function act(btn, fn){
  btn.disabled = true;
  try{ await fn(); }
  catch(err){ if(String(err.message) !== '401') setStatus('Could not reach the guild database.', 'err', 'mStatus'); }
  finally{ btn.disabled = false; }
}

$('mSave').addEventListener('click', function(){
  act(this, async function(){
    const res = await api('/api/photos/' + current.id, {
      method:'PUT', headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ caption: $('mCaption').value, tags: editTags })
    });
    if(!res.ok){
      setStatus(await errorDetail(res), 'err', 'mStatus');
      if(res.status === 422) load();   // a refused caption is logged, so the Rejected count moved
      return;
    }
    Object.assign(current, await res.json());
    const keep = current;
    render();
    current = keep;
    setEditing(false);
    fillPanel(current);
    setStatus('Saved.', 'ok', 'mStatus');
  });
});
$('mApprove').addEventListener('click', function(){
  act(this, async function(){
    const res = await api('/api/photos/' + current.id + '/approve', { method:'POST' });
    if(!res.ok){ setStatus(await errorDetail(res), 'err', 'mStatus'); return; }
    closeModal();
    await load();
  });
});
$('mDelete').addEventListener('click', function(){
  if(!confirm("Delete this photo? This can't be undone.")) return;
  act(this, async function(){
    const res = await api('/api/photos/' + current.id, { method:'DELETE' });
    if(!res.ok && res.status !== 404){ setStatus(await errorDetail(res), 'err', 'mStatus'); return; }
    closeModal();
    await load();
  });
});

load();
</script>
