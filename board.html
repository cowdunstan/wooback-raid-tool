<meta charset="utf-8">
<title>Moved</title>
<!-- The guild tools moved under /legacy/ when the site root opened to the public.
     GitHub Pages has no server-side redirects, so every old top-level URL keeps a
     stub like this one: bookmarks and links pasted in Discord still land. The target
     is spelled out rather than read off location.pathname, which a server is free to
     rewrite. The query string and fragment ride along — old links carry ?name=, ?id=
     and #session=. -->
<script>
  location.replace('legacy/board.html' + location.search + location.hash);
</script>
<noscript><a href="legacy/board.html">This page has moved to /legacy/board.html.</a></noscript>
