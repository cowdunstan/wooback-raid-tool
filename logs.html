<meta charset="utf-8">
<script>
/* Access gate (home tier). Runs before anything renders: captures a session
   handed back by the auth Worker (logs.html#session=…), and bounces to the
   landing page if there is no unexpired session. Warcraft Logs are public, so
   any signed-in tier may view them — the Worker only issues sessions to
   home-role or officer holders. */
(function(){
  var m = location.hash.match(/(?:^#|&)session=([^&]+)/);
  if(m){
    try{ localStorage.setItem('vashj_session', decodeURIComponent(m[1])); }catch(e){}
    history.replaceState(null, '', location.pathname + location.search);
  }
  function valid(tok){
    if(!tok) return false;
    try{
      var p = tok.split('.')[0].replace(/-/g,'+').replace(/_/g,'/');
      while(p.length % 4) p += '=';
      var payload = JSON.parse(atob(p));
      return payload.exp && payload.exp > Math.floor(Date.now()/1000);
    }catch(e){ return false; }
  }
  var tok = null;
  try{ tok = localStorage.getItem('vashj_session'); }catch(e){}
  if(!valid(tok)){
    try{ localStorage.removeItem('vashj_session'); }catch(e){}
    location.replace('index.html');
  }
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<div class="app">
  <div class="wrap">
    <div class="topbar">
      <div class="nav">
        <button class="hamburger" id="navToggle" aria-label="Menu" aria-expanded="false" aria-controls="navDrawer">
          <span></span><span></span><span></span>
        </button>
        <nav class="nav-drawer" id="navDrawer"></nav>
      </div>
      <span class="topbar-right">
        <span id="authWho" class="auth-who"></span>
        <button class="btn-ghost" onclick="logout()">Sign out</button>
      </span>
    </div>

    <div class="home-hero">
      <span class="eyebrow">Guild Tools</span>
      <h1>Warcraft Logs</h1>
      <p class="subtitle">The wooback guild's 25 most recent logs, newest first. Click any raid to open it on Warcraft Logs, tbc-audit, or This Is Fine.</p>
    </div>

    <div class="logs-toolbar">
      <button class="btn-primary" id="refreshBtn" onclick="loadLogs()">Refresh</button>
      <button class="btn-ghost" id="forceRefreshBtn" onclick="loadLogs(true)" data-officer-only title="Bypass the server cache and pull live from Warcraft Logs">Force refresh</button>
      <a class="btn-ghost" id="guildLink" href="#" target="_blank" rel="noopener" style="display:none;">Open guild on Warcraft Logs →</a>
      <span class="spacer"></span>
      <span id="logStatus" class="logs-status"></span>
    </div>

    <div id="logList" class="log-list"></div>

    <footer>wooback guild tools — logs pulled live from Warcraft Logs.</footer>
  </div>
</div>

<script src="menu.js"></script>
<script>
  // API_BASE (the shared .NET backend host, which proxies Warcraft Logs) is provided by menu.js.
  function setStatus(msg, isErr){
    const el = document.getElementById('logStatus');
    el.textContent = msg || '';
    el.style.color = isErr ? 'var(--amber)' : 'var(--text-dim)';
  }

  function esc(s){
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  // The same report can be audited in two community tools besides Warcraft Logs
  // itself: tbc-audit reads it from a ?report= query, This Is Fine from a #/report/
  // hash route. The WCL link comes ready-made from the server as r.url.
  const TBC_AUDIT_URL    = 'https://www.tbc-audit.com/?report=';
  const THIS_IS_FINE_URL = 'https://thisisfine.team/#/report/';

  // Warcraft Logs start/end times are epoch milliseconds.
  function fmtDate(ms){
    if(!ms) return '';
    try{
      return new Date(ms).toLocaleDateString(undefined,
        { weekday:'short', year:'numeric', month:'short', day:'numeric' });
    }catch(e){ return ''; }
  }

  function render(data){
    const list = document.getElementById('logList');
    const link = document.getElementById('guildLink');
    if(data.guildUrl){
      link.href = data.guildUrl;
      link.style.display = '';
    }
    const reports = data.reports || [];
    if(!reports.length){
      list.innerHTML = '<div class="log-empty">No logs found for this guild yet.</div>';
      return;
    }
    list.innerHTML = reports.map(function(r){
      const title = esc(r.title) || 'Untitled log';
      const zone  = r.zone ? '<span class="log-zone">' + esc(r.zone) + '</span>' : '';
      const owner = r.owner ? '<span class="log-owner">uploaded by ' + esc(r.owner) + '</span>' : '';
      // WCL always links (r.url is server-supplied); the two audit tools key off the
      // report code, so only offer them when the report carries one.
      const link = function(href, label){
        return '<a href="' + esc(href) + '" target="_blank" rel="noopener">' + label + '</a>';
      };
      const audits = r.code
        ? link(TBC_AUDIT_URL + encodeURIComponent(r.code), 'tbc-audit →') +
          link(THIS_IS_FINE_URL + encodeURIComponent(r.code), 'This Is Fine →')
        : '';
      return '<div class="log-item">' +
               '<button class="log-head" type="button" aria-expanded="false">' +
                 '<div class="log-item-main">' +
                   '<span class="log-title">' + title + '</span>' + zone +
                 '</div>' +
                 '<div class="log-item-meta">' +
                   '<span class="log-date">' + esc(fmtDate(r.startTime)) + '</span>' + owner +
                   '<span class="log-go">Open <span class="log-chevron">▾</span></span>' +
                 '</div>' +
               '</button>' +
               '<div class="log-links">' +
                 link(r.url, 'Warcraft Logs →') + audits +
               '</div>' +
             '</div>';
    }).join('');
    setStatus(reports.length + (reports.length === 1 ? ' log' : ' logs'));
  }

  async function loadLogs(force){
    const btn = document.getElementById('refreshBtn');
    const forceBtn = document.getElementById('forceRefreshBtn');
    const list = document.getElementById('logList');
    btn.disabled = true;
    if(forceBtn) forceBtn.disabled = true;
    setStatus(force ? 'Pulling live from Warcraft Logs…' : 'Loading…');
    list.innerHTML = '<div class="log-empty">Loading logs…</div>';
    try{
      // Officers can force a live pull past the 30-min server cache (?fresh=1);
      // the server ignores the flag for non-officers, so this stays a safe no-op.
      const url = API_BASE + '/wcl/reports' + (force ? '?fresh=1' : '');
      const res = await fetch(url, {
        headers: { 'Authorization': 'Bearer ' + sessionToken() }
      });
      let data = {};
      try{ data = await res.json(); }catch(e){}
      if(!res.ok){
        const detail = (data && data.detail) || ('Request failed (' + res.status + ').');
        list.innerHTML = '<div class="log-empty">' + esc(detail) + '</div>';
        setStatus(detail, true);
        return;
      }
      render(data);
    }catch(err){
      const msg = 'Could not reach the log service.';
      list.innerHTML = '<div class="log-empty">' + esc(msg) + '</div>';
      setStatus(msg, true);
    }finally{
      btn.disabled = false;
      if(forceBtn) forceBtn.disabled = false;
    }
  }

  // One delegated handler on the stable list container — render() replaces the
  // rows' innerHTML on every refresh, so binding per-row would leak. A row toggles
  // open to reveal its three links; the <button> head handles Enter/Space for free.
  document.getElementById('logList').addEventListener('click', function(e){
    const head = e.target.closest('.log-head');
    if(!head) return;
    const item = head.closest('.log-item');
    const open = item.classList.toggle('open');
    head.setAttribute('aria-expanded', open ? 'true' : 'false');
  });

  loadLogs();
</script>
