<meta charset="utf-8">
<script>
/* Access gate. Same as loot-history.html: the hall of shame is open to any
   signed-in tier — it is built entirely from /api/loot/history, which is
   session-gated; this only decides whether the page renders at all. */
(function(){
  var m = location.hash.match(/(?:^#|&)session=([^&]+)/);
  if(m){
    try{ localStorage.setItem('vashj_session', decodeURIComponent(m[1])); }catch(e){}
    history.replaceState(null, '', location.pathname + location.search);
  }
  function valid(tok){
    if(!tok) return false;
    try{
      var p = tok.split('.')[0].replace(/-/g,'+').replace(/_/g,'/');
      while(p.length % 4) p += '=';
      var payload = JSON.parse(atob(p));
      return payload.exp && payload.exp > Math.floor(Date.now()/1000);
    }catch(e){ return false; }
  }
  var tok = null;
  try{ tok = localStorage.getItem('vashj_session'); }catch(e){}
  if(!valid(tok)){
    try{ localStorage.removeItem('vashj_session'); }catch(e){}
    location.replace('index.html');
  }
})();
</script>

<script>

// The loot stats are computed server-side now — /api/loot/stats returns fully-assembled
// cards, and this page does nothing but render them. Every value, blurb, threshold and
// ranking lives in the backend (Api/LootStatsEndpoints.cs); all that is left here is
// turning typed refs into class-coloured names, item links and plain text.
// API_BASE, itemLink, loadWowhead, sessionToken and logout all come from menu.js.
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// WoW class colours (Blizzard palette), shared with loot-history.html / loot.html.
const CLASS_COLORS = {
  warrior:'#c79c6e', paladin:'#f58cba', hunter:'#abd473', rogue:'#fff569',
  priest:'#ffffff', deathknight:'#e0475f', shaman:'#3b8de0', mage:'#69ccf0',
  warlock:'#a99ce0', monk:'#00ff96', druid:'#ff7d0a', demonhunter:'#a330c9',
  evoker:'#33937f'
};
function classColor(cls){
  if(!cls) return null;
  return CLASS_COLORS[String(cls).toLowerCase().replace(/[^a-z]/g,'')] || null;
}

/* ───────────────────────── Rendering ─────────────────────────
   A ref the backend sends is one of three kinds: a character (class-coloured, linked to
   its sheet), an item (an itemLink that carries a Wowhead tooltip), or plain text (a
   date, a name we hold no character for). Everything on the page is built from these. */
function refHtml(r){
  if(!r) return '';
  if(r.kind === 'item') return itemLink(r.id, r.name);
  if(r.kind === 'char'){
    const col = classColor(r.cls);
    const inner = '<span' + (col ? ' style="color:' + col + '"' : '') + '>' + esc(r.name) + '</span>';
    return r.id ? '<a href="character.html?id=' + esc(r.id) + '" class="chr-link">' + inner + '</a>' : inner;
  }
  return esc(r.text);
}
function segHtml(segs){ return (segs || []).map(refHtml).join(''); }

// The winner of a card, given its own row so the name can breathe.
function topHtml(e){
  return '<div class="ls-top"><span class="ls-name">' + refHtml(e.ref) + '</span>' +
         '<span class="ls-value">' + esc(e.value) + '</span></div>';
}
// A runner-up line in the ranked list beneath the winner.
function liHtml(e, rank){
  return '<li><span class="rank">' + rank + '.</span>' + refHtml(e.ref) +
         '<span class="val">' + esc(e.value) + '</span></li>';
}

function cardHtml(c){
  const head = '<h2><span class="ls-emoji">' + c.emoji + '</span>' + esc(c.title) + '</h2>' +
               '<p class="ls-blurb">' + esc(c.blurb) + '</p>';
  const entries = c.entries || [];
  if(!entries.length) return '<div class="ls-card">' + head + '<div class="ls-none">Not enough data yet.</div></div>';
  const rest = entries.slice(1);
  return '<div class="ls-card">' + head + topHtml(entries[0]) +
    (c.detail && c.detail.length ? '<div class="ls-detail">' + segHtml(c.detail) + '</div>' : '') +
    (rest.length ? '<ul class="ls-rest">' + rest.map((e, i) => liHtml(e, i + 2)).join('') + '</ul>' : '') +
    '</div>';
}

function summaryHtml(items){
  return (items || []).map(p => '<div><b>' + esc(p.value) + '</b>' + esc(p.label) + '</div>').join('');
}

function render(data){
  document.getElementById('grid').innerHTML = (data.cards || []).map(cardHtml).join('');
  const s = document.getElementById('summary');
  s.innerHTML = summaryHtml(data.summary);
  s.style.display = '';
  document.getElementById('msg').style.display = 'none';
  loadWowhead(); // the cards carry item links
}

function fail(text){
  document.getElementById('msg').textContent = text;
}

async function load(){
  try{
    const res = await fetch(API_BASE + '/api/loot/stats', { headers:{ 'Authorization':'Bearer ' + sessionToken() } });
    if(res.status === 401){
      fail('Session expired — signing out…');
      setTimeout(logout, 1200);
      return;
    }
    if(!res.ok){ fail('Could not load loot (HTTP ' + res.status + ').'); return; }
    const data = await res.json();
    if(!data.cards || !data.cards.length){ fail('No loot has been recorded yet — nothing to be smug about.'); return; }
    render(data);
  }catch(err){
    fail('Could not reach the guild database.');
  }
}

load();
</script>
